seed: 42

device: auto

paths:
  raw_dir: data/raw
  processed_dir: data/e2_project
  artifact_dir: artifacts/e2
  result_dir: results/e2

model:
  d_model: 128
  n_heads: 4
  n_encoder_layers: 2
  n_decoder_layers: 2
  d_ff: 512
  dropout: 0.10
  max_len: 128

vocab:
  src_vocab_size: 8000
  tgt_vocab_size: 8000
  model_type: bpe
  character_coverage: 0.9995

training:
  max_epochs: 5
  batch_size: 32
  eval_batch_size: 64
  learning_rate: 0.0003
  warmup_steps: 4000
  label_smoothing: 0.10
  weight_decay: 0.01
  grad_clip: 1.0
  patience: 2
  min_delta: 0.0005
  num_workers: 0
  amp: true
  gradient_accumulation_steps: 1
  log_every: 100
  save_every_epoch: true

data:
  max_train_pairs: 100000
  max_val_pairs: 10000
  max_test_pairs: 10000
  min_chars: 2
  max_chars: 300
  max_tokens: 126
  val_ratio: 0.05
  test_ratio: 0.05
  source_language: en
  target_language: or

inference:
  max_new_tokens: 126
  beam_size: 4
  length_penalty: 0.7